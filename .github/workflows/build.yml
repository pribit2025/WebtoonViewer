# GitHub에 push하면 자동으로 APK를 빌드합니다.
# 결과물: Actions 탭 > 해당 실행 > Artifacts > WebtoonViewer-apk
# 최초 1회: project.b64(소스 압축본)가 있으면 풀어서 저장소에 커밋한 뒤 빌드합니다.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source (first run only)
        if: hashFiles('project.b64') != ''
        run: |
          base64 -d project.b64 | tar -xJ
          rm project.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack WebtoonViewer source"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: WebtoonViewer-apk
          path: app/build/outputs/apk/debug/*.apk
